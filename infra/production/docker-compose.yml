# ProGüzellik — CANLI ortam (VPS: /opt/proguzellik). Diğer projelerden tamamen yalıtılmıştır:
#  - Kendi proje adı, ağı, volume'ları ve konteyner adları ("proguzellik-prod-*"). Başka projenin
#    PostgreSQL/Redis'i kullanılmaz.
#  - Hiçbir port host'a yayınlanmaz. İlk kurulumda hiçbir servis ortak ağa bağlanmaz. Yayına alırken
#    yalnızca "web", docker-compose.edge.yml ile ortak vekil ağına (edge_proxy) eklenir
#    (.env: COMPOSE_FILE=docker-compose.yml:docker-compose.edge.yml). api, worker, postgres ve redis
#    dışarıya kapalı "internal" ağdadır (internet çıkışı da yoktur).
#  - Migration normal başlangıçta ÇALIŞMAZ; yalnızca "migrate" servisiyle elle çalıştırılır.
#
# Kullanım (/opt/proguzellik içinde, .env dosyası yanında):
#   docker compose run --rm migrate                      # migration (önce yedek!)
#   docker compose up -d postgres redis api worker web   # uygulama
#   docker compose run --rm -it api node dist/cli/create-owner.js --email ... --name "..."
# Ayrıntı: docs/deployment.md
name: proguzellik-prod

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    container_name: proguzellik-prod-postgres
    environment:
      POSTGRES_USER: ${PG_OWNER_USER:-proguzellik_owner}
      POSTGRES_PASSWORD: ${PG_OWNER_PASSWORD:?PG_OWNER_PASSWORD gerekli}
      POSTGRES_DB: ${PG_DB:-proguzellik}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    cpus: 1.0
    shm_size: 128m

  redis:
    <<: *hardening
    image: redis:7-alpine
    container_name: proguzellik-prod-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD gerekli}
    # BullMQ için noeviction zorunlu
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    cpus: 0.5

  api:
    <<: *hardening
    image: proguzellik-api:${APP_VERSION:?APP_VERSION gerekli (ör. git commit kısaltması)}
    container_name: proguzellik-prod-api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Uygulama sürecine migration sahibi (DATABASE_URL) VERİLMEZ.
    environment: &app-env
      NODE_ENV: production
      API_PORT: "4000"
      APP_DATABASE_URL: postgresql://app_tenant:${APP_TENANT_DB_PASSWORD:?}@postgres:5432/${PG_DB:-proguzellik}
      PLATFORM_DATABASE_URL: postgresql://app_platform:${APP_PLATFORM_DB_PASSWORD:?}@postgres:5432/${PG_DB:-proguzellik}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      QUEUE_PREFIX: proguzellik
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY gerekli}
      MFA_ENFORCE_PLATFORM: "1"
      WEB_ORIGIN: ${PUBLIC_URL:?PUBLIC_URL gerekli}
      APP_URL: ${PUBLIC_URL}
      TRUST_PROXY: "1"
      # Başlangıçta kapalı: herkese açık işletme kaydı yok
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-0}
      # Boş: yalnız SaaS sahibinin onayladığı fiyatlar görünür (online satış kapalı). 0: acil durum, tüm tutarlar gizli.
      PRICING_PUBLIC: ${PRICING_PUBLIC:-}
      # E-posta varsayılan olarak kapalı (mock: canlıda hiçbir e-posta "gönderildi" sayılmaz).
      # Açmak için .env'de EMAIL_MODE=smtp + SMTP_URL ve COMPOSE_FILE'a docker-compose.egress.yml eklenir.
      EMAIL_MODE: ${EMAIL_MODE:-mock}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-ProGüzellik <info@proguzellik.com>}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-info@proguzellik.com}
      # e-Fatura/e-Arşiv entegratörü yok: kesim engelli, yalnızca taslak/harici kayıt
      EINVOICE_PROVIDER: none
      # Diğer entegrasyonlar pasif: gerçek servise bağlanılmaz
      WHATSAPP_MODE: mock
      PAYMENT_MODE: mock
      AI_MODE: mock
      # Kuyruk işçileri ve günlük görev yalnızca "worker" servisinde çalışır.
      JOBS_ENABLED: "0"
      NOTIFICATIONS_WORKER: "0"
      JOBS_CRON: "0 3 * * *"
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1.0

  worker:
    <<: *hardening
    image: proguzellik-api:${APP_VERSION:?}
    container_name: proguzellik-prod-worker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *app-env
      JOBS_ENABLED: "1"
      NOTIFICATIONS_WORKER: "1"
    command: ["node", "dist/cli/worker.js"]
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "const t=+require('fs').readFileSync('/tmp/worker-heartbeat','utf8');process.exit(Date.now()-t<90000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 384m
    cpus: 0.5

  web:
    <<: *hardening
    image: proguzellik-web:${APP_VERSION:?}
    container_name: proguzellik-prod-web
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      API_URL: http://proguzellik-prod-api:4000
      TRUST_PROXY: "1"
      HOSTNAME: 0.0.0.0
      # Kanonik adres (site haritası, robots, Open Graph)
      SITE_URL: ${PUBLIC_URL:?PUBLIC_URL gerekli}
    # Ortak vekil ağına (edge_proxy) yalnızca docker-compose.edge.yml ile bağlanır (Caddy adımında).
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp:size=64m", "/app/.next/cache:size=128m,uid=1000,gid=1000"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/giris').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0

  # Tek seferlik migration. Normal "up" ile başlamaz (profil: ops).
  migrate:
    image: proguzellik-api:${APP_VERSION:?}
    profiles: [ops]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${PG_OWNER_USER:-proguzellik_owner}:${PG_OWNER_PASSWORD}@postgres:5432/${PG_DB:-proguzellik}
    command: ["node", "dist/cli/migrate.js", "deploy", "--confirm"]
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

networks:
  internal:
    name: proguzellik_prod_internal
    internal: true

volumes:
  pg_data:
    name: proguzellik_prod_pg
  redis_data:
    name: proguzellik_prod_redis
